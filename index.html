<!DOCTYPE html>
<html lang="en" data-theme="dark">
<!--
    EMY TALENT — index.html
    
    Architecture:
    - data-theme on <html> drives CSS custom-property switching (dark/light)
    - <header id="navbar"> and all <div id="*-mount"> are filled by main.js
      via fetch() from src/components/*.html
    - Bootstrap JS loads synchronously so it's ready when components inject
      accordion/carousel HTML
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="EMYTALENT SOLUTION LIMITED — HR Advisory, Payroll Management, Recruitment, and Transformational Training Solutions. Building stronger teams, developing effective leaders, driving sustainable business growth.">
    <!-- theme-color updates via JS to match current mode -->
    <meta name="theme-color" id="meta-theme-color" content="#0f0f0f">
    <title>EMYTALENT SOLUTION LIMITED — Empowering People. Transforming Businesses.</title>

    <!--
        FAVICON SUITE
        Browsers pick the best size automatically:
          - favicon.ico       → legacy browsers (IE, old bookmarks)
          - favicon-16x16.png → browser tab (standard)
          - favicon-32x32.png → browser tab (retina / high-DPI)
          - apple-touch-icon  → iOS home screen shortcut
          - icon-192x192.png  → Android home screen / PWA
          - icon-512x512.png  → PWA splash screen
    -->
    <link rel="icon"             href="./src/assets/icon/favicon.ico"         sizes="any">
    <link rel="icon"             href="./src/assets/icon/favicon-16x16.png"   type="image/png" sizes="16x16">
    <link rel="icon"             href="./src/assets/icon/favicon-32x32.png"   type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" href="./src/assets/icon/apple-touch-icon.png">

    <!--
        Open Graph / Social sharing
        These control the image + text shown when the site is
        shared on WhatsApp, LinkedIn, Twitter, Facebook etc.
        Replace og:image with a real hosted URL before launch.
    -->
    <meta property="og:type"        content="website">
    <meta property="og:title"       content="EMYTALENT SOLUTION LIMITED — Empowering People. Transforming Businesses.">
    <meta property="og:description" content="HR Advisory & Business Partnering, Payroll Management, Recruitment, and Transformational Training Solutions. Building stronger teams and driving measurable results.">
    <meta property="og:image"       content="https://yourdomain.com/src/assets/icon/icon-512x512.png">
    <meta property="og:url"         content="https://yourdomain.com">
    <meta name="twitter:card"       content="summary_large_image">

    <!--
        Inline theme-init: read saved preference BEFORE first paint
        to prevent a flash of the wrong theme.
    -->
    <script>
        (function () {
            var saved = localStorage.getItem('emy-theme');
            /* Default to dark if nothing saved */
            if (saved === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
                var m = document.getElementById('meta-theme-color');
                if (m) m.content = '#f5f5f5';
            }
        })();
    </script>

    <!-- Google Fonts — preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap">

    <!--
        Preload the hero image — it's the Largest Contentful Paint (LCP) element.
        Browser starts fetching it immediately, before CSS even parses.
        Using optimized local images for faster load times.
    -->
    <link rel="preload"
          as="image"
          href="./src/assets/images/hero/hero-meeting.jpg"
          imagesrcset="
              ./src/assets/images/hero/hero-meeting-mobile.jpg  480w,
              ./src/assets/images/hero/hero-meeting-tablet.jpg  800w,
              ./src/assets/images/hero/hero-meeting.jpg 1200w
          "
          imagesizes="(max-width: 991px) 100vw, 50vw">

    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Site styles — load order matters: Bootstrap → tokens → custom -->
    <link rel="stylesheet" href="./src/css/bootstrap.min.css">
    <link rel="stylesheet" href="./src/css/variables.css">
    <link rel="stylesheet" href="./src/css/main.css">
</head>

<body>

    <!-- ══════════════════════════════════════════════════════════
         PAGE SPINNER
         Shown while components are fetched. Hidden by main.js.
    ══════════════════════════════════════════════════════════ -->
    <div id="spinner" class="page-spinner show" aria-hidden="true">
        <div class="page-spinner__loader" role="status">
            <span class="visually-hidden">Loading…</span>
        </div>
    </div>

    <!-- ══════════════════════════════════════════════════════════
         NAVBAR — injected from src/components/navbar.html
    ══════════════════════════════════════════════════════════ -->
    <header id="navbar"></header>

    <!-- ══════════════════════════════════════════════════════════
         MAIN CONTENT
    ══════════════════════════════════════════════════════════ -->
    <main>

        <!-- ── HERO ─────────────────────────────────────────── -->
        <section id="intro" aria-label="Hero">
            <div class="container">
                <div class="row align-items-center g-5"
                     style="min-height: calc(100vh - var(--navbar-h))">

                    <!-- Left: headline + CTA -->
                    <div class="col-lg-6 hero-content">
                        <div class="hero-asterisk fade-in-up" aria-hidden="true">✳</div>

                        <h1 class="hero-title fade-in-up">
                            Empowering People.<br>
                            <span class="text-accent">Transforming Businesses.</span><br>
                            Driving Results.
                        </h1>

                        <p class="hero-subtitle fade-in-up">
                            We partner with organizations to build stronger teams, develop effective leaders,
                            and deliver measurable results through strategic HR solutions.
                        </p>

                        <div class="hero-actions fade-in-up">
                            <a href="#services" class="btn-brand">
                                Explore Our Services
                                <i class="bi bi-arrow-right ms-1" aria-hidden="true"></i>
                            </a>
                            <a href="tel:+2348106748321" class="hero-phone">
                                <span class="hero-phone-icon" aria-hidden="true">
                                    <i class="bi bi-telephone-fill"></i>
                                </span>
                                +234 810 674 8321
                            </a>
                        </div>
                    </div>

                    <!-- Right: shaped hero image -->
                    <div class="col-lg-6">
                        <div class="hero-image-wrap fade-in-right">
                            <span class="hero-float-asterisk" aria-hidden="true">✳</span>

                            <button class="hero-play-btn" aria-label="Watch our story">
                                <i class="bi bi-play-fill" aria-hidden="true"></i>
                            </button>

                            <div class="hero-image-card">
                                <!--
                                    HERO IMAGE — above the fold, loads eagerly (no lazy).
                                    Uses optimized local images for maximum performance.
                                    Responsive srcset for desktop, tablet, and mobile.
                                -->
                                <img
                                    src="./src/assets/images/hero/hero-meeting.jpg"
                                    srcset="
                                        ./src/assets/images/hero/hero-meeting-mobile.jpg  480w,
                                        ./src/assets/images/hero/hero-meeting-tablet.jpg  800w,
                                        ./src/assets/images/hero/hero-meeting.jpg 1200w
                                    "
                                    sizes="(max-width: 991px) 100vw, 50vw"
                                    alt="Diverse African business professionals discussing HR strategy in modern office meeting room"
                                    width="1200"
                                    height="800"
                                    loading="eager"
                                    fetchpriority="high"
                                    decoding="async"
                                >
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </section>

        <!-- ── COMPONENT MOUNT POINTS ───────────────────────── -->
        <!--
            Each div below is an injection target for main.js.
            The id matches the key used in the loadComponent() call.
        -->
        <div id="about-mount"></div>
        <div id="whyus-mount"></div>
        <div id="services-mount"></div>
        <div id="training-mount"></div>
        <div id="testimonials-mount"></div>
        <div id="contact-mount"></div>

    </main>

    <!-- ── FOOTER ───────────────────────────────────────────── -->
    <footer id="footer-mount"></footer>

    <!-- ── BACK-TO-TOP BUTTON ───────────────────────────────── -->
    <!--
        Visibility toggled by main.js (scroll > 400px).
        CSS handles the show/hide animation.
    -->
    <button id="back-to-top"
            class="back-to-top"
            aria-label="Back to top"
            title="Back to top">
        <i class="bi bi-arrow-up" aria-hidden="true"></i>
    </button>

    <!-- ── SCRIPTS ──────────────────────────────────────────── -->
    <!--
        Bootstrap bundle (includes Popper) loaded synchronously
        so accordion/carousel work when components are injected.
        main.js is deferred — runs after DOM is parsed.
    -->
    <script src="./src/js/bootstrap.bundle.min.js"></script>
    <script defer src="./src/js/main.js"></script>

</body>
</html>
